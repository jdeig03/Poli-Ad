<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Oswald:wght@500;600;700&family=Inter:wght@500;600;700;800&display=swap">
<style>body{margin:0;background:#888} .wrap{display:flex;flex-direction:column;gap:20px;padding:20px} svg{display:block}</style>
</head><body><div class="wrap" id="w"></div>
<script src="logos.js"></script>
<script src="variants.js"></script><script src="variants3.js"></script>
<script>
(async()=>{
 const fams=['700 100px Montserrat','800 100px Montserrat','900 100px Montserrat','700 100px Oswald','600 100px Oswald','500 100px Oswald'];
 await Promise.all(fams.map(f=>document.fonts.load(f)));
 await document.fonts.ready;
 const w=document.getElementById('w');
 for(const v of ROUND3.VARIANTS){ w.insertAdjacentHTML('beforeend', v.sign()); w.insertAdjacentHTML('beforeend', v.banner()); }
 ROUND2.layoutVariants(w);
 document.body.dataset.ready='1';
})();
</script></body></html>
