<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Oswald:wght@500;600;700&family=Barlow+Semi+Condensed:wght@600;700;800&family=Archivo+Black&family=Bebas+Neue&family=Inter:wght@500;600;700;800&family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,800;1,9..144,600&display=swap">
<style>body{margin:0;background:#888} .wrap{display:flex;flex-direction:column;gap:20px;padding:20px} svg{display:block}</style>
</head><body><div class="wrap" id="w"></div>
<script src="logos.js"></script>
<script>
(async()=>{
 const fams=['700 100px Montserrat','900 100px Montserrat','700 100px Oswald','600 100px Oswald','500 100px Oswald','800 100px "Barlow Semi Condensed"','700 100px "Barlow Semi Condensed"','600 100px "Barlow Semi Condensed"','400 100px "Archivo Black"','400 100px "Bebas Neue"','800 100px Inter','700 100px Inter','800 100px Fraunces','italic 600 100px Fraunces'];
 await Promise.all(fams.map(f=>document.fonts.load(f)));
 await document.fonts.ready;
 const w=document.getElementById('w');
 for(const c of MILLER.CONCEPTS){ w.insertAdjacentHTML('beforeend', c.banner()); w.insertAdjacentHTML('beforeend', c.sign()); }
 MILLER.layoutAll(w);
 document.body.dataset.ready='1';
})();
</script></body></html>
