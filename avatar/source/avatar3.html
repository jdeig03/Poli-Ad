<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Poli Character</title>
<style>html,body{margin:0;background:#fff;overflow:hidden}canvas{display:block}</style>
<script type="importmap">
{ "imports": { "three": "./node_modules/three/build/three.module.js", "three/addons/": "./node_modules/three/examples/jsm/" } }
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// -----------------------------------------------------------------------------------------------
// Poli, the character. The head is the exact logo artwork (projected onto a real sphere so bodies
// and hands occlude correctly); no tone mapping, so the logo's colors are reproduced exactly.
// Bodies are original. ?c=wisp|bud|poised  ?p=hero|happy|unsure|listening|idle  ?bg=light|dark
// -----------------------------------------------------------------------------------------------
const Q = new URLSearchParams(location.search);
const C = Q.get('c') || 'wisp', P = Q.get('p') || 'hero', BG = Q.get('bg') || 'light';
const SIZE = Number(Q.get('size') || 1024);

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(2); renderer.setSize(SIZE, SIZE);
renderer.toneMapping = THREE.NoToneMapping;           // keep the logo's colors exact
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = BG === 'dark' ? 0.42 : 0.55;

{ const c = document.createElement('canvas'); c.width = c.height = 1024; const g = c.getContext('2d');
  if (BG === 'dark') {
    g.fillStyle = '#05060D'; g.fillRect(0, 0, 1024, 1024);
    [[170, 250, 640, 'rgba(28,86,219,0.26)'], [520, 640, 560, 'rgba(122,79,184,0.18)'], [900, 920, 640, 'rgba(220,53,71,0.17)']].forEach(([x, y, r, col]) => {
      const rg = g.createRadialGradient(x, y, 0, x, y, r); rg.addColorStop(0, col); rg.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = rg; g.fillRect(0, 0, 1024, 1024); });
  } else {
    const rg = g.createRadialGradient(512, 430, 60, 512, 520, 780);
    rg.addColorStop(0, '#E9E5F1'); rg.addColorStop(0.55, '#DCD6E8'); rg.addColorStop(1, '#C3BBD8');
    g.fillStyle = rg; g.fillRect(0, 0, 1024, 1024);
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; scene.background = t; }

const camera = new THREE.PerspectiveCamera(26, 1, 0.1, 100);
const key = new THREE.DirectionalLight(0xffffff, 0.85); key.position.set(-2.5, 5, 4); scene.add(key);
const fill = new THREE.DirectionalLight(0xe6e9ff, 0.25); fill.position.set(4, 1, 3); scene.add(fill);
scene.add(new THREE.HemisphereLight(0xffffff, 0xb8a8e6, 0.45));

const BLUE = new THREE.Color(0x1C56DB), PURPLE = new THREE.Color(0x7A4FB8), RED = new THREE.Color(0xDC3547);
const brand = t => t < 0.5 ? BLUE.clone().lerp(PURPLE, t * 2) : PURPLE.clone().lerp(RED, (t - 0.5) * 2);
const pearl = () => new THREE.MeshPhysicalMaterial({ color: 0xf6f4fb, roughness: 0.26, clearcoat: 1, clearcoatRoughness: 0.06,
  iridescence: 0.16, iridescenceIOR: 1.35, iridescenceThicknessRange: [180, 420], sheen: 0.1, sheenColor: new THREE.Color(0xe4dbff) });

// ---------------------------------------------------------------- geometry helpers
function lathe(profile, seg = 180) {                 // profile: [[r, y], ...] from bottom to top
  const curve = new THREE.SplineCurve(profile.map(([r, y]) => new THREE.Vector2(r, y)));
  const pts = curve.getPoints(160); pts[0].x = 0; pts[pts.length - 1].x = 0;
  const g = new THREE.LatheGeometry(pts, seg); g.computeVertexNormals(); return g;
}
function spindle(len, r, bulge = 0.35, tipA = 0.25, tipB = 0.15) {   // tapered limb along +y from 0..len
  const prof = []; const n = 24;
  for (let i = 0; i <= n; i++) { const t = i / n; const s = Math.sin(Math.PI * Math.pow(t, 0.85));
    prof.push([Math.max(0.0001, r * Math.pow(s, 0.7) * (1 - (1 - bulge) * Math.pow(t, 1.4)) * (t < 0.08 ? 0.6 + 5 * t : 1)), t * len]); }
  return lathe(prof, 64);
}
const UP = new THREE.Vector3(0, 1, 0);
function limb(from, to, r, mat, opts = {}) {
  const a = new THREE.Vector3(...from), b = new THREE.Vector3(...to), d = b.clone().sub(a);
  const m = new THREE.Mesh(spindle(d.length(), r, opts.bulge ?? 0.35), mat);
  m.quaternion.setFromUnitVectors(UP, d.clone().normalize()); m.position.copy(a); return m;
}
function capLimb(from, to, r0, r1, mat) {            // smooth rounded limb, gently tapering r0 -> r1
  const a = new THREE.Vector3(...from), b = new THREE.Vector3(...to), d = b.clone().sub(a), L = d.length();
  const g = new THREE.CapsuleGeometry(1, 1, 16, 48);
  const pos = g.attributes.position;
  for (let i = 0; i < pos.count; i++) { const y = pos.getY(i); const t = THREE.MathUtils.clamp((y + 1.5) / 3, 0, 1); const rr = THREE.MathUtils.lerp(r0, r1, t);
    pos.setXYZ(i, pos.getX(i) * rr, ((y + 1.5) / 3) * L, pos.getZ(i) * rr); }
  g.computeVertexNormals();
  const m = new THREE.Mesh(g, mat); m.quaternion.setFromUnitVectors(UP, d.clone().normalize()); m.position.copy(a); return m;
}
function ellipsoid(sx, sy, sz, mat) { const g = new THREE.SphereGeometry(1, 96, 48); g.scale(sx, sy, sz); return new THREE.Mesh(g, mat); }
function glowArc(w, h, y, z, thick = 0.012) {        // a small echo of the smile, as a heart-light on the chest
  const pts = []; for (let i = 0; i <= 40; i++) { const t = i / 40, x = (t - 0.5) * w; pts.push(new THREE.Vector3(x, y + h * Math.pow(2 * t - 1, 2), z)); }
  const geo = new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 80, thick, 10, false);
  const cols = []; const uv = geo.attributes.uv; for (let i = 0; i < uv.count; i++) { const c = brand(uv.getX(i)).multiplyScalar(2.2); cols.push(c.r, c.g, c.b); }
  geo.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
  return new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ vertexColors: true }));
}

// ---------------------------------------------------------------- the head: exact logo on a real sphere
const R = 0.62, ORB_IN_PNG = 384 / 1344, S = (R / ORB_IN_PNG) * 1.012;   // sphere samples just inside the orb; the PNG's own edge shows on the halo plane   // S: world width of the whole PNG
const tex = await new THREE.TextureLoader().loadAsync('poli-logo-orb.png');
tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8;
const head = new THREE.Group();
const headSphere = new THREE.Mesh(new THREE.SphereGeometry(R, 192, 96), new THREE.ShaderMaterial({
  uniforms: { map: { value: tex }, uC: { value: new THREE.Vector3() }, uR: { value: new THREE.Vector3(1, 0, 0) }, uU: { value: new THREE.Vector3(0, 1, 0) }, uS: { value: S } },
  vertexShader: `varying vec3 vW; void main(){ vec4 w = modelMatrix * vec4(position, 1.0); vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`,
  fragmentShader: `uniform sampler2D map; uniform vec3 uC, uR, uU; uniform float uS; varying vec3 vW;
    void main(){ vec3 d = vW - uC; vec2 uv = vec2(dot(d, uR), dot(d, uU)) / uS + 0.5; vec4 t = texture2D(map, uv); gl_FragColor = vec4(t.rgb, 1.0); }`,
}));
head.add(headSphere);
const haloPlane = new THREE.Mesh(new THREE.PlaneGeometry(S, S), new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false }));
head.add(haloPlane);
// the orb's own light: blue and red from the smile, lavender from the halo
const lB = new THREE.PointLight(0x2f63ff, 1.6, 3, 2); lB.position.set(-0.5, -0.25, 0.45); head.add(lB);
const lR = new THREE.PointLight(0xff3d58, 1.4, 3, 2); lR.position.set(0.5, -0.25, 0.45); head.add(lR);
scene.add(head);

// ---------------------------------------------------------------- hover glow
function hoverGlow(y, w) {
  const c = document.createElement('canvas'); c.width = c.height = 512; const g = c.getContext('2d');
  const rg = g.createRadialGradient(256, 256, 0, 256, 256, 256);
  rg.addColorStop(0, BG === 'dark' ? 'rgba(150,115,255,0.55)' : 'rgba(70,45,150,0.32)'); rg.addColorStop(0.4, BG === 'dark' ? 'rgba(110,80,230,0.18)' : 'rgba(70,45,150,0.10)'); rg.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = rg; g.fillRect(0, 0, 512, 512);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, w * 0.42), new THREE.MeshBasicMaterial({ map: t, transparent: true, depthWrite: false, blending: BG === 'dark' ? THREE.AdditiveBlending : THREE.NormalBlending }));
  m.rotation.x = -Math.PI / 2; m.position.y = y; return m;
}

// ---------------------------------------------------------------- characters
const body = new THREE.Group(); scene.add(body);
const mat = pearl();
let cam = [0, 0, 8], look = [0, -0.9, 0], yaw = -0.2, lean = 0;

// arm poses: [shoulderOffset, direction (unit-ish), length] per side, per pose
const POSE = {
  hero:      { L: [-0.55, -0.85], R: [0.55, 0.85], lean: 0.0 },     // right arm up: hello
  idle:      { L: [-0.35, -0.94], R: [0.35, -0.94], lean: 0.0 },
  happy:     { L: [-0.62, 0.78], R: [0.62, 0.78], lean: -0.04 },    // both up: delighted
  unsure:    { L: [-0.92, -0.22], R: [0.92, -0.22], lean: 0.0 },    // the shrug: "I don't know yet"
  listening: { L: [0.5, -0.62], R: [-0.5, -0.62], lean: 0.08, z: 0.55 },   // hands gather in front of the chest, leaning in
};
const pose = POSE[P] || POSE.hero;
const dir2 = ([x, y]) => { const l = Math.hypot(x, y); return [x / l, y / l]; };

if (C === 'wisp') {
  // one flowing form: neck, shoulders, then a long tapering tail that sweeps to the side
  const prof = [[0, -2.62], [0.025, -2.5], [0.07, -2.25], [0.14, -1.96], [0.23, -1.68], [0.32, -1.42], [0.39, -1.2], [0.41, -1.05], [0.38, -0.92], [0.26, -0.8], [0.14, -0.7], [0.1, -0.6], [0.0, -0.5]];
  const geo = lathe(prof);
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) { const y = pos.getY(i); const k = Math.max(0, (-1.35 - y) / 1.27); pos.setX(i, pos.getX(i) + 0.42 * k * k); pos.setZ(i, pos.getZ(i) - 0.18 * k * k); }
  geo.computeVertexNormals();
  body.add(new THREE.Mesh(geo, mat));
  body.add(glowArc(0.22, 0.05, -1.08, 0.405, 0.011));
  // slender arms that float just off the shoulders
  for (const side of [-1, 1]) {
    const [dx, dy] = dir2(side < 0 ? pose.L : pose.R);
    const s = [side * 0.47, -0.96, 0.02];
    body.add(limb([s[0], s[1], s[2] + (pose.z ? 0.12 : 0)], [s[0] + dx * (pose.z ? 0.62 : 0.95), s[1] + dy * (pose.z ? 0.62 : 0.95), s[2] + (pose.z || 0.12)], 0.075, mat));
  }
  body.add(hoverGlow(-2.85, 2.4));
  cam = [0, 0.1, 9.4]; look = [0, -1.0, 0];
} else if (C === 'bud') {
  // compact, friendly: a soft rounded body under the orb, floating mitten hands
  const prof = [[0, -1.62], [0.16, -1.6], [0.3, -1.52], [0.39, -1.38], [0.42, -1.2], [0.39, -1.02], [0.3, -0.88], [0.18, -0.78], [0.1, -0.72], [0.0, -0.7]];
  body.add(new THREE.Mesh(lathe(prof), mat));
  body.add(glowArc(0.22, 0.048, -1.08, 0.415, 0.011));
  for (const side of [-1, 1]) {
    const [dx, dy] = dir2(side < 0 ? pose.L : pose.R);
    const h = ellipsoid(0.12, 0.17, 0.1, mat);
    h.position.set(side * 0.5 + dx * (pose.z ? 0.42 : 0.34), -1.02 + dy * 0.34 + 0.06, 0.14 + (pose.z ? 0.35 : 0)); h.rotation.z = Math.atan2(dy, dx) - Math.PI / 2;
    body.add(h);
  }
  body.add(hoverGlow(-1.9, 2.0));
  cam = [0, 0.1, 7.0]; look = [0, -0.6, 0];
} else if (C === 'poised') {
  // slim and tall: neck, tapered torso, floating jointed limbs, hovering on pointed toes
  body.add(capLimb([0, -0.9, 0], [0, -0.62, 0], 0.07, 0.06, mat));
  const torso = [[0, -1.96], [0.09, -1.93], [0.15, -1.82], [0.18, -1.64], [0.22, -1.44], [0.28, -1.22], [0.33, -1.06], [0.33, -0.96], [0.24, -0.9], [0.1, -0.87], [0.0, -0.865]];
  body.add(new THREE.Mesh(lathe(torso), mat));
  body.add(glowArc(0.18, 0.04, -1.1, 0.345, 0.009));
  for (const side of [-1, 1]) {
    const [dx, dy] = dir2(side < 0 ? pose.L : pose.R);
    const s = [side * 0.43, -0.98, 0.02];
    const e = [s[0] + dx * 0.5, s[1] + dy * 0.5, s[2] + 0.06];
    body.add(capLimb(s, e, 0.072, 0.06, mat));                                         // upper arm
    const f = [e[0] + dx * 0.06, e[1] + dy * 0.06, e[2]];
    const bend = side < 0 ? pose.L : pose.R; const fd = dir2([bend[0] * 0.9, bend[1] + (P === 'unsure' ? 0.9 : 0.15)]);
    body.add(capLimb(f, [f[0] + fd[0] * 0.44, f[1] + fd[1] * 0.44, f[2] + 0.06], 0.058, 0.045, mat));   // forearm
    // legs: thigh + shin, floating apart, toes pointed down
    const hip = [side * 0.1, -2.0, 0];
    const knee = [side * 0.13, -2.58, 0.03];
    body.add(capLimb(hip, knee, 0.085, 0.07, mat)); body.add(capLimb([knee[0], knee[1] - 0.06, knee[2]], [side * 0.12, -3.18, 0.05], 0.066, 0.04, mat));
  }
  body.add(hoverGlow(-3.42, 2.2));
  cam = [0, 0.0, 10.6]; look = [0, -1.38, 0];
}
body.rotation.y = yaw; body.rotation.x = pose.lean;
head.position.set(0, 0, 0);
if (pose.lean) { head.position.z = pose.lean * 1.4; head.position.y = -pose.lean * 0.5; }

camera.position.set(...cam); camera.lookAt(...look); camera.updateMatrixWorld();
// head faces the camera exactly; projection basis = camera right/up
haloPlane.lookAt(camera.position); haloPlane.position.set(0, 0, 0);
scene.updateMatrixWorld();
const e = camera.matrixWorld.elements;
headSphere.material.uniforms.uR.value.set(e[0], e[1], e[2]).normalize();
headSphere.material.uniforms.uU.value.set(e[4], e[5], e[6]).normalize();
headSphere.material.uniforms.uC.value.copy(head.getWorldPosition(new THREE.Vector3()));
haloPlane.quaternion.copy(camera.quaternion);

const rt = new THREE.WebGLRenderTarget(SIZE * 2, SIZE * 2, { samples: 4, type: THREE.HalfFloatType });
const composer = new EffectComposer(renderer, rt); composer.setPixelRatio(2); composer.setSize(SIZE, SIZE);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(SIZE * 2, SIZE * 2), 0.28, 0.4, 1.6));
composer.addPass(new OutputPass());
composer.render();
window.done = true;
</script>
</body>
</html>
